name: Kiểm mốc

on:
  push:
    branches:
      - "moc/**"
  pull_request:
    branches:
      - main

jobs:
  kiem-moc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kiểm mốc
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BRANCH="${GITHUB_HEAD_REF}"
          else
            BRANCH="${GITHUB_REF_NAME}"
          fi

          MOC="${BRANCH##*/}"
          python scripts/kiem_moc.py "$MOC"
